<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">LinkMint short URL creation journey</title>
  <desc id="desc">Animated flowchart showing a browser sending a long URL to the LinkMint frontend and FastAPI backend on Render, which validates it, creates a seven-character code, stores the mapping in the links table on Neon PostgreSQL, and returns the short URL.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#102a2a" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#123a34" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#287c63"/>
    </marker>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f4d5" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b8f4d5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .canvas { fill: #f7f4eb; }
    .grid { fill: url(#grid); }
    .brand { font: 800 24px Manrope, "DM Sans", Arial, sans-serif; fill: #102a2a; letter-spacing: -.5px; }
    .journey { font: 700 13px "DM Sans", Arial, sans-serif; fill: #287c63; letter-spacing: 1.8px; }
    .headline { font: 800 50px Manrope, "DM Sans", Arial, sans-serif; fill: #102a2a; letter-spacing: -2px; }
    .subtitle { font: 400 19px "DM Sans", Arial, sans-serif; fill: #47615f; }
    .legend { font: 600 13px "DM Sans", Arial, sans-serif; fill: #47615f; }
    .card { fill: #fffdf8; stroke: #102a2a; stroke-opacity: .13; stroke-width: 1.5; filter: url(#shadow); }
    .card-accent { fill: #e6fbf0; stroke: #3fd59a; stroke-opacity: .48; }
    .card-db { fill: #eef6ff; stroke: #5f86b5; stroke-opacity: .45; }
    .step { fill: #102a2a; }
    .step-text { font: 800 13px Manrope, Arial, sans-serif; fill: #f7f4eb; text-anchor: middle; dominant-baseline: middle; }
    .place { font: 800 11px "DM Sans", Arial, sans-serif; fill: #287c63; letter-spacing: 1.35px; }
    .place-db { fill: #416b9a; }
    .node-title { font: 800 24px Manrope, "DM Sans", Arial, sans-serif; fill: #102a2a; letter-spacing: -.7px; }
    .node-copy { font: 400 15px "DM Sans", Arial, sans-serif; fill: #47615f; }
    .code-bg { fill: #102a2a; }
    .code { font: 600 13px Consolas, "Courier New", monospace; fill: #b8f4d5; }
    .code-dark { font: 700 12.5px Consolas, "Courier New", monospace; fill: #102a2a; }
    .route { fill: none; stroke: #287c63; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    .route-soft { stroke: #5f86b5; }
    .moving-route { stroke-dasharray: 10 12; animation: dash 1.1s linear infinite; }
    .packet { fill: #3fd59a; stroke: #fffdf8; stroke-width: 4; filter: url(#shadow); }
    .packet-db { fill: #5f86b5; }
    .route-label-bg { fill: #f7f4eb; }
    .route-label { font: 700 12px "DM Sans", Arial, sans-serif; fill: #47615f; text-anchor: middle; letter-spacing: .3px; }
    .note { font: 600 14px "DM Sans", Arial, sans-serif; fill: #47615f; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) {
      .moving-route { animation: none; }
      .packet { display: none; }
    }
  </style>

  <rect class="canvas" width="1600" height="960"/>
  <rect class="grid" width="1600" height="960"/>
  <circle cx="1455" cy="35" r="245" fill="url(#headerGlow)"/>

  <g transform="translate(72 58)">
    <circle cx="24" cy="24" r="24" fill="#102a2a"/>
    <path d="M13 12v24h16v-6H20V12h-7Zm19 0-5 9 5 9 5-9-5-9Z" fill="#b8f4d5"/>
    <text class="brand" x="62" y="32">LinkMint</text>
  </g>
  <text class="journey" x="72" y="145">JOURNEY 01  •  CREATE A SHORT URL</text>
  <text class="headline" x="72" y="205">Long URL in. Clean short link out.</text>
  <text class="subtitle" x="72" y="243">The request stays on Render until the durable mapping is written to Neon PostgreSQL.</text>

  <g transform="translate(1185 82)">
    <circle cx="8" cy="8" r="6" fill="#3fd59a"/>
    <text class="legend" x="24" y="13">request / write</text>
    <circle cx="154" cy="8" r="6" fill="#5f86b5"/>
    <text class="legend" x="170" y="13">database result</text>
  </g>

  <!-- Animated connectors -->
  <path id="create-r1" class="route moving-route" d="M342 400H435"/>
  <path id="create-r2" class="route moving-route" d="M755 400H848"/>
  <path id="create-r3" class="route moving-route" d="M1168 400H1261"/>
  <path id="create-r4" class="route moving-route" d="M1390 506V608"/>
  <path id="create-r5" class="route route-soft moving-route" d="M1260 715H1117"/>
  <path id="create-r6" class="route route-soft moving-route" d="M787 715H644"/>

  <g>
    <circle class="packet" r="8">
      <animateMotion dur="1.35s" repeatCount="indefinite"><mpath href="#create-r1"/></animateMotion>
    </circle>
    <circle class="packet" r="8">
      <animateMotion dur="1.35s" begin="-.35s" repeatCount="indefinite"><mpath href="#create-r2"/></animateMotion>
    </circle>
    <circle class="packet" r="8">
      <animateMotion dur="1.35s" begin="-.7s" repeatCount="indefinite"><mpath href="#create-r3"/></animateMotion>
    </circle>
    <circle class="packet" r="8">
      <animateMotion dur="1.5s" begin="-.2s" repeatCount="indefinite"><mpath href="#create-r4"/></animateMotion>
    </circle>
    <circle class="packet packet-db" r="8">
      <animateMotion dur="1.65s" begin="-.55s" repeatCount="indefinite"><mpath href="#create-r5"/></animateMotion>
    </circle>
    <circle class="packet packet-db" r="8">
      <animateMotion dur="1.65s" begin="-.95s" repeatCount="indefinite"><mpath href="#create-r6"/></animateMotion>
    </circle>
  </g>

  <!-- Route labels -->
  <g transform="translate(388 378)">
    <rect class="route-label-bg" x="-44" y="-14" width="88" height="25" rx="12"/>
    <text class="route-label" y="4">form submit</text>
  </g>
  <g transform="translate(802 378)">
    <rect class="route-label-bg" x="-45" y="-14" width="90" height="25" rx="12"/>
    <text class="route-label" y="4">POST /links</text>
  </g>
  <g transform="translate(1215 378)">
    <rect class="route-label-bg" x="-38" y="-14" width="76" height="25" rx="12"/>
    <text class="route-label" y="4">validated</text>
  </g>
  <g transform="translate(1210 693)">
    <rect class="route-label-bg" x="-47" y="-14" width="94" height="25" rx="12"/>
    <text class="route-label" y="4">INSERT result</text>
  </g>
  <g transform="translate(716 693)">
    <rect class="route-label-bg" x="-45" y="-14" width="90" height="25" rx="12"/>
    <text class="route-label" y="4">201 Created</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(72 310)">
    <rect class="card" width="270" height="180" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">1</text>
    <text class="place" x="60" y="36">USER DEVICE</text>
    <text class="node-title" x="28" y="83">Browser</text>
    <text class="node-copy" x="28" y="111">User pastes a long URL</text>
    <text class="node-copy" x="28" y="134">into the LinkMint form.</text>
    <rect class="code-bg" x="28" y="150" width="214" height="24" rx="8"/>
    <text class="code" x="40" y="167">https://example.com/…</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(435 310)">
    <rect class="card card-accent" width="320" height="180" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">2</text>
    <text class="place" x="60" y="36">RENDER • FRONTEND</text>
    <text class="node-title" x="28" y="83">LinkMint UI</text>
    <text class="node-copy" x="28" y="111">JavaScript reads the form and</text>
    <text class="node-copy" x="28" y="134">builds a JSON API request.</text>
    <rect class="code-bg" x="28" y="150" width="264" height="24" rx="8"/>
    <text class="code" x="40" y="167">{ "target_url": "…" }</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(848 310)">
    <rect class="card card-accent" width="320" height="180" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">3</text>
    <text class="place" x="60" y="36">RENDER • FASTAPI</text>
    <text class="node-title" x="28" y="83">Create endpoint</text>
    <text class="node-copy" x="28" y="111">FastAPI receives and routes</text>
    <text class="node-copy" x="28" y="134">the request into LinkMint.</text>
    <rect class="code-bg" x="28" y="150" width="264" height="24" rx="8"/>
    <text class="code" x="40" y="167">POST /links</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1261 310)">
    <rect class="card card-accent" width="258" height="196" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">4</text>
    <text class="place" x="60" y="36">RENDER • APP</text>
    <text class="node-title" x="28" y="82">Validate + mint</text>
    <text class="node-copy" x="28" y="110">Pydantic validates HTTP(S).</text>
    <text class="node-copy" x="28" y="133">Service generates a secure</text>
    <text class="node-copy" x="28" y="156">7-character Base62 code.</text>
    <rect class="code-bg" x="28" y="164" width="202" height="24" rx="8"/>
    <text class="code" x="40" y="181">y1sMSXO</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(1260 608)">
    <rect class="card card-db" width="260" height="214" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">5</text>
    <text class="place place-db" x="60" y="36">NEON • POSTGRESQL</text>
    <text class="node-title" x="28" y="82">links table</text>
    <text class="node-copy" x="28" y="110">Stores one durable mapping:</text>
    <rect class="code-bg" x="28" y="128" width="204" height="54" rx="10"/>
    <text class="code" x="40" y="149">short_code → y1sMSXO</text>
    <text class="code" x="40" y="170">target_url → example…</text>
    <text class="node-copy" x="28" y="202">Primary key ensures uniqueness.</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(787 620)">
    <rect class="card card-accent" width="330" height="190" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">6</text>
    <text class="place" x="60" y="36">RENDER • FASTAPI</text>
    <text class="node-title" x="28" y="83">Build response</text>
    <text class="node-copy" x="28" y="111">The persisted code becomes a</text>
    <text class="node-copy" x="28" y="134">public short URL.</text>
    <rect class="code-bg" x="28" y="150" width="274" height="26" rx="8"/>
    <text class="code" x="40" y="168">…onrender.com/y1sMSXO</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(304 620)">
    <rect class="card" width="340" height="190" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">7</text>
    <text class="place" x="60" y="36">USER DEVICE</text>
    <text class="node-title" x="28" y="83">Short link ready</text>
    <text class="node-copy" x="28" y="111">The browser displays Copy and</text>
    <text class="node-copy" x="28" y="134">Open actions for the new link.</text>
    <rect x="28" y="150" width="122" height="26" rx="9" fill="#b8f4d5"/>
    <text class="code-dark" x="50" y="168">COPY LINK</text>
  </g>

  <g transform="translate(72 884)">
    <circle cx="7" cy="7" r="7" fill="#3fd59a"/>
    <text class="note" x="25" y="12">Durability checkpoint: the short URL is returned only after PostgreSQL accepts the mapping.</text>
  </g>
</svg>
