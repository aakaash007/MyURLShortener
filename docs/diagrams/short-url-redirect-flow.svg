<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">LinkMint short URL redirect journey</title>
  <desc id="desc">Animated flowchart showing a browser requesting an existing LinkMint short URL, the FastAPI backend on Render querying the links table on Neon PostgreSQL, Neon returning the original URL, and Render issuing an HTTP 302 redirect that the browser follows.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#102a2a" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#123a34" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-request" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#287c63"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l9 5-9 5z" fill="#5f86b5"/>
    </marker>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f4d5" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b8f4d5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .canvas { fill: #f7f4eb; }
    .grid { fill: url(#grid); }
    .brand { font: 800 24px Manrope, "DM Sans", Arial, sans-serif; fill: #102a2a; letter-spacing: -.5px; }
    .journey { font: 700 13px "DM Sans", Arial, sans-serif; fill: #287c63; letter-spacing: 1.8px; }
    .headline { font: 800 50px Manrope, "DM Sans", Arial, sans-serif; fill: #102a2a; letter-spacing: -2px; }
    .subtitle { font: 400 19px "DM Sans", Arial, sans-serif; fill: #47615f; }
    .legend { font: 600 13px "DM Sans", Arial, sans-serif; fill: #47615f; }
    .card { fill: #fffdf8; stroke: #102a2a; stroke-opacity: .13; stroke-width: 1.5; filter: url(#shadow); }
    .card-render { fill: #e6fbf0; stroke: #3fd59a; stroke-opacity: .48; }
    .card-db { fill: #eef6ff; stroke: #5f86b5; stroke-opacity: .45; }
    .card-external { fill: #fff3df; stroke: #d29c4d; stroke-opacity: .45; }
    .step { fill: #102a2a; }
    .step-text { font: 800 13px Manrope, Arial, sans-serif; fill: #f7f4eb; text-anchor: middle; dominant-baseline: middle; }
    .place { font: 800 11px "DM Sans", Arial, sans-serif; fill: #287c63; letter-spacing: 1.35px; }
    .place-db { fill: #416b9a; }
    .place-external { fill: #996a25; }
    .node-title { font: 800 23px Manrope, "DM Sans", Arial, sans-serif; fill: #102a2a; letter-spacing: -.7px; }
    .node-copy { font: 400 14px "DM Sans", Arial, sans-serif; fill: #47615f; }
    .code-bg { fill: #102a2a; }
    .code { font: 600 12.5px Consolas, "Courier New", monospace; fill: #b8f4d5; }
    .code-dark { font: 700 12px Consolas, "Courier New", monospace; fill: #102a2a; }
    .route { fill: none; stroke: #287c63; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow-request); }
    .response-route { stroke: #5f86b5; marker-end: url(#arrow-response); }
    .external-route { stroke: #b77a23; marker-end: url(#arrow-request); }
    .moving-route { stroke-dasharray: 10 12; animation: dash 1.1s linear infinite; }
    .packet { fill: #3fd59a; stroke: #fffdf8; stroke-width: 4; filter: url(#shadow); }
    .packet-response { fill: #5f86b5; }
    .packet-external { fill: #d29c4d; }
    .route-label-bg { fill: #f7f4eb; }
    .route-label { font: 700 12px "DM Sans", Arial, sans-serif; fill: #47615f; text-anchor: middle; letter-spacing: .3px; }
    .lane-label { font: 800 12px "DM Sans", Arial, sans-serif; letter-spacing: 1.4px; }
    .note { font: 600 14px "DM Sans", Arial, sans-serif; fill: #47615f; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) {
      .moving-route { animation: none; }
      .packet { display: none; }
    }
  </style>

  <rect class="canvas" width="1600" height="960"/>
  <rect class="grid" width="1600" height="960"/>
  <circle cx="1455" cy="35" r="245" fill="url(#headerGlow)"/>

  <g transform="translate(72 58)">
    <circle cx="24" cy="24" r="24" fill="#102a2a"/>
    <path d="M13 12v24h16v-6H20V12h-7Zm19 0-5 9 5 9 5-9-5-9Z" fill="#b8f4d5"/>
    <text class="brand" x="62" y="32">LinkMint</text>
  </g>
  <text class="journey" x="72" y="145">JOURNEY 02  •  OPEN AN EXISTING SHORT URL</text>
  <text class="headline" x="72" y="205">Short code in. Original destination found.</text>
  <text class="subtitle" x="72" y="243">Render asks Neon for the mapping, then answers the browser with an HTTP redirect.</text>

  <g transform="translate(1160 82)">
    <circle cx="8" cy="8" r="6" fill="#3fd59a"/>
    <text class="legend" x="24" y="13">request</text>
    <circle cx="114" cy="8" r="6" fill="#5f86b5"/>
    <text class="legend" x="130" y="13">database response</text>
    <circle cx="286" cy="8" r="6" fill="#d29c4d"/>
    <text class="legend" x="302" y="13">browser redirect</text>
  </g>

  <text class="lane-label" x="72" y="299" fill="#287c63">REQUEST →</text>
  <text class="lane-label" x="72" y="618" fill="#5f86b5">← RESPONSE</text>

  <!-- Animated connectors -->
  <path id="open-r1" class="route moving-route" d="M332 416H390"/>
  <path id="open-r2" class="route moving-route" d="M680 416H738"/>
  <path id="open-r3" class="route moving-route" d="M1028 416H1086"/>
  <path id="open-r4" class="route moving-route" d="M1376 504V608"/>
  <path id="open-r5" class="route response-route moving-route" d="M1240 714H1074"/>
  <path id="open-r6" class="route response-route moving-route" d="M744 714H578"/>
  <path id="open-r7" class="route external-route moving-route" d="M338 714H182"/>

  <g>
    <circle class="packet" r="8"><animateMotion dur="1.3s" repeatCount="indefinite"><mpath href="#open-r1"/></animateMotion></circle>
    <circle class="packet" r="8"><animateMotion dur="1.3s" begin="-.3s" repeatCount="indefinite"><mpath href="#open-r2"/></animateMotion></circle>
    <circle class="packet" r="8"><animateMotion dur="1.3s" begin="-.6s" repeatCount="indefinite"><mpath href="#open-r3"/></animateMotion></circle>
    <circle class="packet" r="8"><animateMotion dur="1.45s" begin="-.2s" repeatCount="indefinite"><mpath href="#open-r4"/></animateMotion></circle>
    <circle class="packet packet-response" r="8"><animateMotion dur="1.7s" begin="-.4s" repeatCount="indefinite"><mpath href="#open-r5"/></animateMotion></circle>
    <circle class="packet packet-response" r="8"><animateMotion dur="1.7s" begin="-.8s" repeatCount="indefinite"><mpath href="#open-r6"/></animateMotion></circle>
    <circle class="packet packet-external" r="8"><animateMotion dur="1.7s" begin="-1.2s" repeatCount="indefinite"><mpath href="#open-r7"/></animateMotion></circle>
  </g>

  <!-- Route labels -->
  <g transform="translate(360 394)"><rect class="route-label-bg" x="-34" y="-14" width="68" height="25" rx="12"/><text class="route-label" y="4">HTTPS</text></g>
  <g transform="translate(709 394)"><rect class="route-label-bg" x="-26" y="-14" width="52" height="25" rx="12"/><text class="route-label" y="4">route</text></g>
  <g transform="translate(1057 394)"><rect class="route-label-bg" x="-38" y="-14" width="76" height="25" rx="12"/><text class="route-label" y="4">SELECT</text></g>
  <g transform="translate(1157 692)"><rect class="route-label-bg" x="-49" y="-14" width="98" height="25" rx="12"/><text class="route-label" y="4">target_url row</text></g>
  <g transform="translate(661 692)"><rect class="route-label-bg" x="-43" y="-14" width="86" height="25" rx="12"/><text class="route-label" y="4">302 Location</text></g>
  <g transform="translate(260 692)"><rect class="route-label-bg" x="-47" y="-14" width="94" height="25" rx="12"/><text class="route-label" y="4">follow URL</text></g>

  <!-- Step 1 -->
  <g transform="translate(72 326)">
    <rect class="card" width="260" height="178" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">1</text>
    <text class="place" x="60" y="36">USER DEVICE</text>
    <text class="node-title" x="28" y="82">Browser request</text>
    <text class="node-copy" x="28" y="109">User opens the short URL.</text>
    <rect class="code-bg" x="28" y="130" width="204" height="28" rx="8"/>
    <text class="code" x="40" y="149">…render.com/y1sMSXO</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(390 326)">
    <rect class="card card-render" width="290" height="178" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">2</text>
    <text class="place" x="60" y="36">RENDER • FASTAPI</text>
    <text class="node-title" x="28" y="82">Redirect endpoint</text>
    <text class="node-copy" x="28" y="109">FastAPI extracts the code</text>
    <text class="node-copy" x="28" y="131">from the URL path.</text>
    <rect class="code-bg" x="28" y="145" width="234" height="25" rx="8"/>
    <text class="code" x="40" y="163">GET /{short_code}</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(738 326)">
    <rect class="card card-render" width="290" height="178" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">3</text>
    <text class="place" x="60" y="36">RENDER • REPOSITORY</text>
    <text class="node-title" x="28" y="82">Build lookup</text>
    <text class="node-copy" x="28" y="109">SQLAlchemy prepares a safe</text>
    <text class="node-copy" x="28" y="131">parameterized query.</text>
    <rect class="code-bg" x="28" y="145" width="234" height="25" rx="8"/>
    <text class="code" x="40" y="163">short_code = y1sMSXO</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1086 326)">
    <rect class="card card-db" width="290" height="178" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">4</text>
    <text class="place place-db" x="60" y="36">NEON • POSTGRESQL</text>
    <text class="node-title" x="28" y="82">Find active row</text>
    <text class="node-copy" x="28" y="108">Primary-key lookup checks:</text>
    <text class="node-copy" x="28" y="130">active = true and not expired.</text>
    <rect class="code-bg" x="28" y="145" width="234" height="25" rx="8"/>
    <text class="code" x="40" y="163">SELECT target_url</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(1240 608)">
    <rect class="card card-db" width="280" height="212" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">5</text>
    <text class="place place-db" x="60" y="36">NEON • LINKS TABLE</text>
    <text class="node-title" x="28" y="82">Return mapping</text>
    <text class="node-copy" x="28" y="109">Neon returns the stored</text>
    <text class="node-copy" x="28" y="131">original destination.</text>
    <rect class="code-bg" x="28" y="150" width="224" height="42" rx="9"/>
    <text class="code" x="40" y="168">target_url:</text>
    <text class="code" x="40" y="185">https://example.com/…</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(744 620)">
    <rect class="card card-render" width="330" height="188" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">6</text>
    <text class="place" x="60" y="36">RENDER • FASTAPI</text>
    <text class="node-title" x="28" y="82">Issue redirect</text>
    <text class="node-copy" x="28" y="109">FastAPI answers without serving</text>
    <text class="node-copy" x="28" y="131">the destination page itself.</text>
    <rect class="code-bg" x="28" y="150" width="274" height="25" rx="8"/>
    <text class="code" x="40" y="168">302  Location: target_url</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(338 620)">
    <rect class="card" width="240" height="188" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">7</text>
    <text class="place" x="60" y="36">USER DEVICE</text>
    <text class="node-title" x="28" y="82">Follow Location</text>
    <text class="node-copy" x="28" y="109">The browser reads the</text>
    <text class="node-copy" x="28" y="131">redirect header.</text>
    <rect class="code-bg" x="28" y="150" width="184" height="25" rx="8"/>
    <text class="code" x="40" y="168">navigate → original</text>
  </g>

  <!-- Step 8 -->
  <g transform="translate(72 620)">
    <rect class="card card-external" width="266" height="188" rx="24"/>
    <circle class="step" cx="32" cy="32" r="18"/><text class="step-text" x="32" y="33">8</text>
    <text class="place place-external" x="60" y="36">EXTERNAL WEBSITE</text>
    <text class="node-title" x="28" y="82">Destination opens</text>
    <text class="node-copy" x="28" y="109">The original website now</text>
    <text class="node-copy" x="28" y="131">serves its own content.</text>
    <rect x="28" y="150" width="164" height="25" rx="8" fill="#f3d9ac"/>
    <text class="code-dark" x="42" y="168">200 OK (typically)</text>
  </g>

  <g transform="translate(72 884)">
    <circle cx="7" cy="7" r="7" fill="#5f86b5"/>
    <text class="note" x="25" y="12">If no active, unexpired row exists, LinkMint returns 404 instead of redirecting.</text>
  </g>
</svg>
