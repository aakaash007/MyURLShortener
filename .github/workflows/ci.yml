name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check app tests migrations scripts
      - run: ruff format --check app tests migrations scripts
      - run: pytest
      - run: alembic upgrade head --sql
      - run: python scripts/build_frontend.py

